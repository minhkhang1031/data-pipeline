version: 2

models:
  - name: stg_stock_raw
    description: "Clean và deduplicate raw stock data"

    columns:
      - name: dlt_record_id
        tests:
          - unique
          - not_null

      - name: stock_symbol
        tests:
          - not_null

      - name: trading_date
        tests:
          - not_null

      - name: price_open
        tests:
          - not_null

      - name: price_high
        tests:
          - not_null

      - name: price_low
        tests:
          - not_null

      - name: price_close
        tests:
          - not_null

      - name: trading_volume
        tests:
          - not_null  